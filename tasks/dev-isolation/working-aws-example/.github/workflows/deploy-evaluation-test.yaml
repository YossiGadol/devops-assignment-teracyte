name: Deploy evaluation test image
on:
  workflow_dispatch:
  push:
    branches:
      - evaluation
    paths-ignore:
      - '.k8s/**'
      - 'k8s/**'
      - '.git**'
      - 'package-lock.json'
      - '.infra/**'
      - '.env-encrypted.config.json'
      - '.env.*.encrypted'
      - '.dockerignore'
      - 'composer.lock'
      - '.github/workflows/**'
      - '.github/slack.yml'
      - '.gitignore'
      - '.dockerignore'
      - 'get-env-files.sh'
      - 'encrypt-env.sh'
      - 'decrypt-env.sh'
      - 'readme.md'
      - 'README.md'
      - 'docker-compose.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'clean-unused.sh'

jobs:
  build:
    if:      github.ref_name == 'evaluation'
    runs-on: test-envs
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name:  Create DB if it does not exist
        shell: bash
        run:   |
               set -e
               result=$(mysql -e "use evaluation;" || echo 1)
               if [[ $result -eq 0 ]]
                  then
                   echo "Database evaluation already exists."
                  else
                   echo "Creating database evaluation..."
                   echo "create database evaluation default character set utf8mb4 collate utf8mb4_unicode_ci default encryption = 'N';"
                   mysql -e "create database evaluation default character set utf8mb4 collate utf8mb4_unicode_ci default encryption = 'N';"
                   mysql evaluation < /working_example-mysql/working_example-mysql.sql
               fi

      - name:  Grant permissions to DB user
        shell: bash
        run:   |
               set -e
               echo "grant all privileges on evaluation.* to 'working_example'@'%';"
               mysql -e "grant all privileges on evaluation.* to 'working_example'@'%';"

      - name:              Create Postgres DB if it does not exist
        continue-on-error: true
        shell:             bash
        run:               psql postgresql://${{ secrets.PG_USERNAME }}:${{ secrets.PG_PASSWORD }}@${{ secrets.PG_HOST }}:${{ secrets.PG_PORT }} -c "create database vector_evaluation;"

      - name:  Build backend Docker image
        shell: bash
        run:   |
               aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.DOCKER_REGISTRY }}
               cd .k8s/docker/target || exit 1
               commit_hash="$(git rev-parse HEAD)"
               commit_short_hash="$(git rev-parse --short HEAD)"
               commit_message="$(git log -1 --pretty=%B)"
               commit_date="$(git log -1 --pretty=%cd --date=iso)"
               docker buildx build \
                --platform=linux/amd64 \
                --provenance=true \
                --sbom=true \
                --no-cache \
                --build-arg GIT_REV="${revision}" \
                --build-arg GIT_COMMIT_HASH="${commit_hash}" \
                --build-arg GIT_COMMIT_SHORT_HASH="${commit_short_hash}" \
                --build-arg GIT_BRANCH=evaluation \
                --build-arg GIT_COMMIT_MESSAGE="${commit_message}" \
                --build-arg GIT_COMMIT_DATE="${commit_date}" \
                -t ${{ secrets.EVALUATION_IMAGE }} \
                -f Dockerfile "$(git rev-parse --show-toplevel)"

      - name:  Push backend Docker image
        shell: bash
        run:   |
               docker push ${{ secrets.EVALUATION_IMAGE }}
               docker rmi -f ${{ secrets.EVALUATION_IMAGE }}
               docker system prune -f
               docker buildx prune -a -f
               docker ps -aq | xargs -r docker stop | xargs -r docker rm

      - name:  Run migrations
        shell: bash
        run:   |
               cat << EOF | kubectl --context=${{ secrets.DEV_CLUSTER }} apply -f -
               apiVersion: batch/v1
               kind:       Job
               metadata:
                 name: run-evaluation-migrations
               spec:
                 template:
                   spec:
                     volumes:
                       - name: app-evaluation-migrations
                         secret:
                           secretName: app-evaluation
                           items:
                             - key:  text
                               path: text
                     containers:
                       - name:            run-migrations
                         image:           ${{ secrets.EVALUATION_IMAGE }}
                         imagePullPolicy: Always
                         volumeMounts:
                           - mountPath: /app/.env
                             subPath:   text
                             name:      app-evaluation-migrations
                         command:
                           - uv
                           - run
                           - alembic
                           - upgrade
                           - heads
                         resources:
                           limits:
                             cpu:    "8"
                             memory: 8Gi
                           requests:
                             cpu:    "2"
                             memory: 2Gi
                         resizePolicy:
                           - resourceName:  cpu
                             restartPolicy: NotRequired
                           - resourceName:  memory
                             restartPolicy: NotRequired
                     restartPolicy: Never
               EOF
               kubectl --context=${{ secrets.DEV_CLUSTER }} wait --for=condition=complete --timeout=3m job/run-evaluation-migrations


      - name: send notification
        uses: act10ns/slack@v2
        if:   always()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status:      ${{ job.status }}