---
kind:       HTTPScaledObject
apiVersion: http.keda.sh/v1alpha1
metadata:
  name: working_example-{{ .Values.env_name }}
spec:
  hosts:
    - {{ .Values.env_name }}.working-example.com
  pathPrefixes:
    - /
  scaleTargetRef:
    name:       working_example-{{ .Values.env_name }}
    kind:       Deployment
    apiVersion: apps/v1
    service:    working_example-{{ .Values.env_name }}
    port:       80
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 28800
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 1
      window:      1m
