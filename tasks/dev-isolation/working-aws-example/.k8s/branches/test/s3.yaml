apiVersion: v1
kind:       PersistentVolume
metadata:
  name: s3-pv
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 1200Gi
  storageClassName: ""
  claimRef:
    namespace: default
    name:      s3-pvc
  mountOptions:
    - allow-delete
    - region us-east-2
  csi:
    driver:       s3.csi.aws.com
    volumeHandle: working_example-front-s3-volume
    volumeAttributes:
      bucketName:                                 working_example-front-dist
      cache:                                      emptyDir
      cacheEmptyDirSizeLimit:                     2Gi
      cacheEmptyDirMedium:                        ""
      mountpointContainerResourcesRequestsCpu:    500m
      mountpointContainerResourcesRequestsMemory: 1Gi
      mountpointContainerResourcesLimitsCpu:      500m
      mountpointContainerResourcesLimitsMemory:   1Gi
---
apiVersion: v1
kind:       PersistentVolumeClaim
metadata:
  name: s3-pvc
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 1200Gi
  volumeName:       s3-pv    