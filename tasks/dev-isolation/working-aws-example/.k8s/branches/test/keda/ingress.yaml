apiVersion: v1
kind:       Service
metadata:
  name: nginx-cluster-ip
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy:        SingleStack
  ports:
    - name:       http
      port:       80
      protocol:   TCP
      targetPort: 80
  selector:
    app.kubernetes.io/instance: nginx-ingress
    app.kubernetes.io/name:     nginx-ingress
  type:                  ClusterIP
---
apiVersion: eks.amazonaws.com/v1
kind:       IngressClassParams
metadata:
  name: we-external
spec:
  scheme:        internet-facing
  ipAddressType: ipv4
  sslPolicy:     ELBSecurityPolicy-TLS13-1-2-2021-06
  listeners:
    - port:     443
      protocol: HTTPS
    - port:     80
      protocol: HTTP
  certificateARNs:
    - arn:aws:acm:us-east-2:999999999999:certificate-id
---
apiVersion: networking.k8s.io/v1
kind:       IngressClass
metadata:
  name: we-external
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind:     IngressClassParams
    name:     we-external

---
apiVersion: networking.k8s.io/v1
kind:       Ingress
metadata:
  name: we-external
  annotations:
    alb.ingress.kubernetes.io/listen-ports:       '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect:       "443"
    alb.ingress.kubernetes.io/load-balancer-name: we-test-proxy
spec:
  ingressClassName: we-external
  defaultBackend:
    service:
      name: keda-add-ons-http-interceptor-proxy
      port:
        number: 8080