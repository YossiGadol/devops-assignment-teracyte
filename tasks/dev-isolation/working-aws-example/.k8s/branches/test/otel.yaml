apiVersion: v1
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      clickhouse:
        create_schema:     false
        database:          otel
        endpoint:          tcp://ch.elb.us-east-2.amazonaws.com:9000?dial_timeout=10s&async_insert=1&username=ot_user&password=ot_pass
        logs_table_name:   logs
        retry_on_failure:
          enabled: true
        sending_queue:
          queue_size: 100
        timeout:           10s
        traces_table_name: traces
        ttl:               12h
      debug: {}
    processors:
      batch:
        send_batch_size: 10000
        timeout:         10s
      memory_limiter:
        check_interval:         1s
        limit_percentage:       75
        spike_limit_percentage: 15
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        logs:
          exporters:
            - clickhouse
            - debug
          processors:
            - memory_limiter
            - batch
          receivers:
            - otlp
        traces:
          exporters:
            - clickhouse
            - debug
          processors:
            - memory_limiter
            - batch
          receivers:
            - otlp
kind:       ConfigMap
metadata:
  labels:
    app:  otel-collector-config
    name: otel-collector-config
  name: otel-collector-config

---
apiVersion: apps/v1
kind:       Deployment
metadata:
  labels:
    app:  otel-collector
    name: otel-collector
  name: otel-collector
spec:
  replicas:             1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      name: otel-collector
  template:
    metadata:
      labels:
        app:  otel-collector
        name: otel-collector
    spec:
      containers:
        - args:
            - --config=/conf/collector.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath:  metadata.name
          image:           otel/opentelemetry-collector-contrib:0.127.0
          imagePullPolicy: Always
          name:            otel-collector
          ports:
            - containerPort: 4318
              name:          otlp-http
              protocol:      TCP
          resources:
            limits:
              cpu:    250m
              memory: 500Mi
            requests:
              cpu:    5m
              memory: 50Mi
          resizePolicy:
            - resourceName:  cpu
              restartPolicy: RestartContainer
            - resourceName:  memory
              restartPolicy: RestartContainer
          volumeMounts:
            - mountPath: /conf
              name:      otc-internal
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            items:
              - key:  collector.yaml
                path: collector.yaml
            name:        otel-collector-config
          name: otc-internal

---
apiVersion: v1
kind:       Service
metadata:
  labels:
    app.kubernetes.io/name: otel-collector
  name: otel-collector
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy:        SingleStack
  ports:
    - appProtocol: http
      name:        otlp-http
      port:        4318
      protocol:    TCP
      targetPort:  4318
  selector:
    app: otel-collector
  type:                  ClusterIP
