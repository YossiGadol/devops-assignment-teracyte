apiVersion: v1
kind:       Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
    service.beta.kubernetes.io/aws-load-balancer-name:                    we-test
    service.beta.kubernetes.io/aws-load-balancer-scheme:                  internal
    service.beta.kubernetes.io/aws-load-balancer-internal:                "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert:                arn:aws:acm:us-east-2:999999999999:certificate-id,arn:aws:acm:us-east-2:999999999999:certificate-id
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports:               "443"
    service.beta.kubernetes.io/aws-load-balancer-type:                    nlb
  name: nginx-nlb
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy:        SingleStack
  loadBalancerClass:     eks.amazonaws.com/nlb
  ports:
    - name:       http
      port:       80
      protocol:   TCP
      targetPort: 80
    - name:       https
      port:       443
      protocol:   TCP
      targetPort: 80
  selector:
    app.kubernetes.io/instance: nginx-ingress
    app.kubernetes.io/name:     nginx-ingress
  type:                  LoadBalancer