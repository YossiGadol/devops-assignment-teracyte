apiVersion: apps/v1
kind:       Deployment
metadata:
  name: working_example-trainer
  labels:
    app:  working_example-trainer
    name: working_example-trainer
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  revisionHistoryLimit: 0
  replicas:             1
  selector:
    matchLabels:
      app: working_example-trainer
  strategy:
    rollingUpdate:
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: working_example-trainer
    spec:
      imagePullSecrets:
        - name: regcrd
      volumes:
        - name: trainer-dev
          secret:
            secretName: trainer-dev
            items:
              - key:  text
                path: text
      containers:
        - name:            trainer-backend
          image:           999999999999.dkr.ecr.us-east-2.amazonaws.com/working_example/trainer:backend-dev
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /app/.env
              subPath:   text
              name:      trainer-dev
          ports:
            - containerPort: 8555
              protocol:      TCP
              name:          http-backend
          resources:
            limits:
              cpu:    "8"
              memory: 8Gi
            requests:
              cpu:    100m
              memory: 500Mi
          resizePolicy:
            - resourceName:  cpu
              restartPolicy: NotRequired
            - resourceName:  memory
              restartPolicy: NotRequired
        - name:            trainer-frontend
          image:           999999999999.dkr.ecr.us-east-2.amazonaws.com/working_example/trainer:frontend-dev
          imagePullPolicy: Always
          env:
            - name:  REACT_APP_API_URL
              value: https://trainer-dev.working-example.com:8558
            - name:  REACT_APP_ENV
              value: dev
          volumeMounts:
            - mountPath: /app/.env
              subPath:   text
              name:      trainer-dev
          ports:
            - containerPort: 3000
              protocol:      TCP
              name:          http-frontend
          resources:
            limits:
              cpu:    "8"
              memory: 8Gi
            requests:
              cpu:    100m
              memory: 500Mi
          resizePolicy:
            - resourceName:  cpu
              restartPolicy: NotRequired
            - resourceName:  memory
              restartPolicy: NotRequired
---
apiVersion: v1
kind:       Service
metadata:
  name: working_example-trainer
  labels:
    app:  working_example-trainer
    name: working_example-trainer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal:                     "false"
    service.beta.kubernetes.io/aws-load-balancer-scheme:                       internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type:                         nlb
    service.beta.kubernetes.io/aws-load-balancer-listener-attributes.TCP-8558: tcp.idle_timeout.seconds=600
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert:                     arn:aws:acm:us-east-2:999999999999:certificate-id
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports:                    443, 8558
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy:       ELBSecurityPolicy-TLS13-1-2-2021-06
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol:             tcp
    service.beta.kubernetes.io/aws-load-balancer-name:                         trainer-dev
spec:
  ports:
    - name:       http-frontend
      port:       443
      protocol:   TCP
      targetPort: http-frontend
    - name:       http-backend
      port:       8558
      protocol:   TCP
      targetPort: http-backend
  selector:
    app: working_example-trainer
  type: LoadBalancer