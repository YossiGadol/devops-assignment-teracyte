datadog:
  apiKeyExistingSecret: datadog-secret
  apm:
    instrumentation:
      enabled: true
      targets:
      - ddTraceVersions:
          dotnet: "3"
          java: "1"
          js: "5"
          php: "1"
          python: "4"
          ruby: "2"
        name: default-target
        namespaceSelector:
          matchNames:
          - default
  asm:
    iast:
      enabled: false
    sca:
      enabled: false
    threats:
      enabled: false
  autoscaling:
    kubernetesEvents:
      unbundleEvents: false
    workload:
      enabled: false
  clusterChecks:
    enabled: true
  clusterName: app-prod
  containerExclude: name:.*
  containerInclude: name:.*(working_example|trainer|redis).*
  env:
  - name: DD_CONTAINER_EXCLUDE_METRICS
    value: name:.*
  - name: DD_CONTAINER_INCLUDE_METRICS
    value: name:.*(working_example|trainer|redis).*
  - name: DD_ENABLE_PAYLOADS_EVENTS
    value: "true"
  - name: DD_ENABLE_PAYLOADS_SERIES
    value: "true"
  - name: DD_ENABLE_PAYLOADS_SERVICE_CHECKS
    value: "true"
  - name: DD_ENABLE_PAYLOADS_SKETCHES
    value: "true"
  - name: DD_REMOTE_UPDATES
    value: "true"
  logs:
    containerCollectAll: false
    enabled: true
  networkMonitoring:
    enabled: true
  orchestratorExplorer:
    enabled: true
  processAgent:
    processCollection: true
  sbom:
    containerImage:
      enabled: false
    host:
      enabled: false
  securityAgent:
    compliance:
      enabled: false
    runtime:
      enabled: false
  serviceMonitoring:
    enabled: false
  site: datadoghq.com
  tags:
  - env:production
registry: public.ecr.aws/datadog
