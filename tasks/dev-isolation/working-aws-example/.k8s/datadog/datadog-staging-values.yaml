datadog:
  apiKeyExistingSecret: datadog-secret
  apm:
    instrumentation:
      enabled: false
      targets:
      - ddTraceVersions:
          dotnet: "3"
          java: "1"
          js: "5"
          php: "1"
          python: "3"
        name: default-target
        namespaceSelector:
          matchNames:
          - default
  asm:
    iast:
      enabled: false
    sca:
      enabled: false
    threats:
      enabled: false
  clusterName: app-staging
  containerExclude: name:.*
  containerInclude: name:.*(cronitor|otel|working_example|clickhouse-server|trainer|mcp|braintrust).*
  env:
  - name: DD_ENABLE_PAYLOADS_EVENTS
    value: "true"
  - name: DD_ENABLE_PAYLOADS_SERIES
    value: "true"
  - name: DD_ENABLE_PAYLOADS_SERVICE_CHECKS
    value: "true"
  - name: DD_ENABLE_PAYLOADS_SKETCHES
    value: "true"
  - name: DD_CONTAINER_EXCLUDE_METRICS
    value: name:.*
  - name: DD_CONTAINER_INCLUDE_METRICS
    value: name:.*(cronitor|otel|working_example|clickhouse-server|trainer|mcp|braintrust).*
  - name: DD_REMOTE_UPDATES
    value: "true"
  logs:
    containerCollectAll: false
    enabled: true
  networkMonitoring:
    enabled: false
  orchestratorExplorer:
    enabled: false
  processAgent:
    processCollection: false
  sbom:
    containerImage:
      enabled: false
    host:
      enabled: false
  securityAgent:
    compliance:
      enabled: false
    runtime:
      enabled: false
  serviceMonitoring:
    enabled: false
  site: datadoghq.com
  tags:
  - env:staging
registry: public.ecr.aws/datadog
